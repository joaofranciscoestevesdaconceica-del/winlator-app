name: Gerar APK Qemulator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permissão ao Gradle
      run: chmod +x gradlew

    - name: Compilar o APK (Release)
      run: ./gradlew assembleRelease

    - name: Salvar APKs Prontos para Download
      uses: actions/upload-artifact@v4
      with:
        name: Qemulator-APKs
        path: app/build/outputs/apk/release/*.apk
